# Run from this directory: docker compose up -d --build
# .env (next to this file) holds the settings; see docs/NODE-HOSTING.md.
services:
  mstodo-mcp:
    build: { context: ../../.., dockerfile: src/hosts/node/Dockerfile }
    env_file: .env          # required: SERVICE_BASE_URL, MS_TENANT_ID, MS_CLIENT_ID, MS_CLIENT_SECRET, OWNER_EMAIL; optional: OWNER_OBJECT_ID, TIMEZONE (default UTC), …
    volumes: [ "mstodo-data:/data" ]
    ports: [ "127.0.0.1:8787:8787" ]   # put a TLS reverse proxy in front for anything but localhost testing
    restart: unless-stopped
    stop_grace_period: 30s  # shutdown finishes in under 25 s; the default 10 s would SIGKILL a running sync
    deploy: { replicas: 1 }  # one process per database; a second one refuses to start
volumes: { mstodo-data: {} }
