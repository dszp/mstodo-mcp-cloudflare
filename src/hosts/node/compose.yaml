# Run from this directory: docker compose up -d --build
# .env (next to this file) holds the settings; see docs/NODE-HOSTING.md.
services:
  mstodo-mcp:
    build: { context: ../../.., dockerfile: src/hosts/node/Dockerfile }
    env_file: .env          # SERVICE_BASE_URL, TIMEZONE, MS_TENANT_ID, MS_CLIENT_ID, MS_CLIENT_SECRET, OWNER_EMAIL, …
    volumes: [ "mstodo-data:/data" ]
    ports: [ "127.0.0.1:8787:8787" ]   # put a TLS reverse proxy in front; Entra redirect URIs must be https
    restart: unless-stopped
    deploy: { replicas: 1 }  # one process per database; a second one refuses to start
volumes: { mstodo-data: {} }
