name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only checks out and tests — nothing writes. Pinning this
# here overrides the repository default token scope regardless of how it is set.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full-length commit SHAs for supply-chain safety; the
      # trailing comment tracks the human-readable version the SHA resolves to.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # 24: the Node host (and its test project) needs node:sqlite unflagged.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Binding types (KV/Durable Object) live in the gitignored, generated
      # worker-configuration.d.ts. Generate it from the committed example config
      # (placeholder account_id/IDs are irrelevant — only binding shapes matter).
      - name: Generate Worker types
        run: npx wrangler types -c wrangler.example.jsonc

      - name: Typecheck
        run: npx tsc --noEmit

      # The Node host's own check: Node types only, no Workers globals, so a
      # Workers-only API reaching src/core or src/hosts/node fails here.
      - name: Typecheck (Node host)
        run: npx tsc -p tsconfig.node.json

      - name: Build (Node host)
        run: npm run build:node

      - name: Test
        run: npm test
